[project]
name = "author-library"
version = "0.1.0"
description = "MCP server for conversational author intelligence via enriched RAG"
readme = "README.md"
authors = [
    { name = "Marty Martin", email = "marty@locomotive.agency" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.40.0",
    "asyncpg>=0.30.0",
    "neo4j>=5.25.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "numpy>=2.2.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    "chainlit>=2.9.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["author_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["author_library"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "neo4j.*",
    "ebooklib.*",
    "epub.*",
    "docx.*",
    "pymupdf.*",
]
ignore_missing_imports = true
