services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: author-library-pg
    environment:
      POSTGRES_USER: author_library
      POSTGRES_PASSWORD: author_library
      POSTGRES_DB: author_library
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U author_library"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: author-library-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_dev
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_dev", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  pg_data:
  neo4j_data:
