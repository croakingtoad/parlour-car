services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: author-library-pg
    environment:
      POSTGRES_USER: author_library
      POSTGRES_PASSWORD: author_library
      POSTGRES_DB: author_library
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U author_library"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: author-library-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_dev
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_dev", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Disposable Neo4j for the test suite.
  #
  # Neo4j Community serves a single database, so pointing TEST_NEO4J_URL at the
  # development graph means test teardown deletes by work_id prefix inside the
  # same graph that holds the real corpus. That destroyed production data twice
  # (2026-07-02 themes, 2026-08-13 five Guite works / 3,495 chunks), so tests
  # get their own instance instead.
  #
  # Storage is tmpfs: state cannot survive a restart, which is the point.
  # Behind the "test" profile so `docker compose up -d` never starts it:
  #     make test-db-up      (or: docker compose --profile test up -d neo4j-test)
  neo4j-test:
    image: neo4j:5-community
    container_name: parlour-neo4j-test
    profiles: ["test"]
    environment:
      NEO4J_AUTH: neo4j/neo4j_dev
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7688:7687"
      - "7475:7474"
    tmpfs:
      - /data
      - /logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_dev", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: author-library-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  pg_data:
  neo4j_data:
  redis_data:
